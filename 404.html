<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TiflTails</title>
  <script type="text/javascript">
    // GitHub Pages SPA redirect trick for Flutter web with path URL strategy.
    // When GitHub Pages gets a request for /privacy-policy it can't find the file,
    // so it serves this 404.html. We capture the path and redirect to index.html
    // with the path encoded in the query string, then index.html decodes it and
    // calls history.replaceState() to restore the proper URL for Flutter's router.
    var segmentCount = 0;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
