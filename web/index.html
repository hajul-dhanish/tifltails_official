<!DOCTYPE html>
<html class="scroll-smooth" lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#9F3B24">
  <meta name="description" content="TiflTails: Your One-Stop Pet Platform. Find verified rescue companions, arrange pedigree health-screened pet mating, and empower local animal shelters with 100% verified feeding runs.">

  <!-- Open Graph / Social Meta Tags -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="TiflTails - Your One-Stop Pet Platform">
  <meta property="og:description" content="Find verified rescue companions, arrange pedigree health-screened pet mating, and empower local animal shelters with 100% verified feeding runs.">
  <meta property="og:url" content="https://tifltails.com/">

  <!-- Google Fonts: Plus Jakarta Sans & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TiflTails">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TiflTails - Your One-Stop Pet Platform</title>
  <link rel="manifest" href="manifest.json">
</head>
<body class="bg-surface font-body-md text-on-surface antialiased">
  <!-- Restore the path encoded by 404.html for GitHub Pages SPA support -->
  <script type="text/javascript">
    (function(l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function(s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(
          null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location));
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
